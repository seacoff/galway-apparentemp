<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Galway Apparent Temperature</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="card" aria-live="polite">
    <header>
      <div><p class="eyebrow">University of Galway weather station</p><h1>Galway weather</h1></div>
      <button id="refresh" type="button">Refresh</button>
    </header>
    <div id="status" class="status">Loading live readings...</div>
    <section id="readings" class="grid hidden">
      <article><span>Temperature</span><strong id="temperature">--</strong><small>°C</small></article>
      <article class="hero"><span>Apparent temperature</span><strong id="apparent">--</strong><small>°C</small></article>
      <article><span>Humidity</span><strong id="humidity">--</strong><small>%</small></article>
      <article><span>Wind speed</span><strong id="wind">--</strong><small>m/s</small></article>
    </section>
    <p id="detail" class="detail hidden"></p>
    <footer><span id="updated"></span><a href="https://weather.universityofgalway.ie/" target="_blank" rel="noopener noreferrer">View source</a></footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
